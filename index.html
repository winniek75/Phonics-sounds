<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>フォニックスサウンド | Phonics Sounds</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #FF6F00;
    --yes: #00C853;
    --no: #FF1744;
    --card: #FFFFFF;
    --text: #212121;
    --outline: #212121;
    --radius: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #FFAB40; }
  body {
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(160deg, #FFE57F 0%, #FFAB40 50%, #FF7043 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 20px 16px 32px;
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  /* ========== START SCREEN ========== */
  #start-screen { gap: 14px; padding-top: 24px; }

  .game-title {
    font-size: 54px;
    color: var(--card);
    text-shadow: 4px 4px 0 var(--outline);
    animation: bounce 1.4s ease-in-out infinite;
    line-height: 1;
    text-align: center;
  }

  .letter-selector-label {
    font-size: 17px;
    color: var(--card);
    text-shadow: 2px 2px 0 var(--outline);
    text-align: center;
  }

  .groups-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .group-badge {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 11px;
    color: var(--card);
    border-radius: 8px;
    padding: 6px 5px;
    min-width: 28px;
    text-align: center;
    border: 2px solid var(--outline);
    box-shadow: 2px 2px 0 var(--outline);
    line-height: 1.3;
    writing-mode: vertical-rl;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .group-letters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .letter-btn {
    min-width: 50px;
    height: 50px;
    padding: 0 8px;
    border-radius: 11px;
    border: 3px solid var(--outline);
    background: var(--card);
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    color: var(--text);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--outline);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .letter-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--gcolor, #999);
  }
  .letter-btn.digraph { font-size: 17px; min-width: 58px; }
  .letter-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--outline);
  }
  .letter-btn.selected {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--outline);
    background: #FFF9C4;
    border-color: var(--gcolor, #999);
  }
  .letter-btn.selected::after {
    content: '✓';
    position: absolute;
    top: -1px; right: 2px;
    font-size: 12px;
    color: var(--gcolor, #999);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    line-height: 1;
  }
  @media (max-width: 400px) {
    .letter-btn, .letter-btn.digraph { min-width: 44px; height: 46px; padding: 0 4px; }
    .letter-btn { font-size: 22px; }
    .letter-btn.digraph { font-size: 16px; }
  }
  .letter-btn.no-data {
    opacity: 0.3;
    cursor: default;
  }

  .game-subtitle {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
    color: var(--card); text-shadow: 1px 1px 0 var(--outline);
    text-align: center; line-height: 1.5;
  }
  .game-subtitle b { font-size: 18px; letter-spacing: 1px; }
  .deeplink-banner {
    width: 100%; background: #FFF9C4; border: 3px solid var(--outline);
    border-radius: 14px; box-shadow: 3px 3px 0 var(--outline);
    padding: 8px 12px; text-align: center; color: var(--text);
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; line-height: 1.5;
  }
  .deeplink-banner[hidden] { display: none; }
  .deeplink-banner small { display: block; font-size: 12px; color: #795548; }
  .deeplink-banner .banner-start {
    margin-top: 6px; padding: 8px 28px; font-family: 'Fredoka One', cursive; font-size: 22px;
    color: var(--card); background: var(--primary); border: 3px solid var(--outline);
    border-radius: 16px; cursor: pointer; box-shadow: 3px 3px 0 var(--outline);
  }
  .start-note {
    width: 100%; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px;
    color: var(--text); background: rgba(255,255,255,0.75); border-radius: 12px;
    padding: 8px 12px; line-height: 1.6;
  }
  .start-note b { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 14px; }
  .mode-row { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .mode-row[hidden] { display: none; }
  .chip {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; line-height: 1.3;
    color: var(--text); background: var(--card);
    border: 3px solid var(--outline); border-radius: 14px; padding: 8px 12px;
    cursor: pointer; box-shadow: 3px 3px 0 var(--outline);
  }
  .chip small { display: block; font-size: 11px; color: #777; }
  .chip.selected { background: #FFF9C4; border-color: var(--primary); transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--outline); }
  .portal-link {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px;
    color: var(--card); text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    text-decoration: none; border-bottom: 2px dotted rgba(255,255,255,0.8);
    padding: 4px 2px; margin-top: 4px;
  }

  .start-btn {
    padding: 16px 48px;
    font-family: 'Fredoka One', cursive;
    font-size: 32px;
    color: var(--card);
    background: var(--primary);
    border: 4px solid var(--outline);
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: 6px 6px 0 var(--outline);
    transition: transform 0.1s, box-shadow 0.1s;
    animation: pulse-btn 2s ease-in-out infinite;
    margin-top: 6px;
  }
  .start-btn:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--outline); animation: none; }
  .start-btn:disabled { opacity: 0.4; animation: none; cursor: not-allowed; }

  /* ========== GAME SCREEN ========== */
  #game-screen { gap: 10px; padding: 14px 20px 24px; justify-content: flex-start; }

  .hud {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .score-box {
    background: var(--card);
    border: 3px solid var(--outline);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 26px;
    color: var(--text);
    box-shadow: 3px 3px 0 var(--outline);
    min-width: 70px;
    text-align: center;
  }
  .score-box span {
    font-size: 11px; display: block;
    font-family: 'Nunito', sans-serif; font-weight: 700; color: #888;
  }
  .timer-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .timer-num {
    font-size: 40px; color: var(--card);
    text-shadow: 3px 3px 0 var(--outline); line-height: 1;
  }
  .timer-num.small { font-size: 26px; padding: 7px 0; }
  .timer-num.warning { color: #FF1744; animation: shake 0.25s ease infinite; }
  .timer-bar-bg {
    width: 100%; height: 12px; background: rgba(0,0,0,0.2);
    border-radius: 99px; overflow: hidden; border: 2px solid var(--outline);
  }
  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, #76FF03, #FFD600, #FF1744);
    border-radius: 99px; transition: width 0.1s linear;
  }

  .target-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
  .phase-label {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px;
    color: var(--text); background: #FFF9C4; border: 2px solid var(--outline);
    border-radius: 50px; padding: 3px 14px;
  }
  .phase-label.warmup { background: #B3E5FC; }
  .rule-text {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 19px; line-height: 1.35;
    color: var(--card); text-shadow: 2px 2px 0 var(--outline); text-align: center;
  }
  .rule-text .snd { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 24px; color: #FFF59D; }
  .sound-note {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px; line-height: 1.5;
    color: var(--text); background: rgba(255,255,255,0.8); border-radius: 10px; padding: 4px 10px; text-align: center;
  }
  .sound-note[hidden] { display: none; }
  .target-label {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px;
    color: var(--card); text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 1px 1px 0 var(--outline);
  }
  .target-letter {
    font-size: 52px; line-height: 1;
    color: var(--card); text-shadow: 4px 4px 0 var(--outline);
    background: var(--primary);
    border: 4px solid var(--outline); border-radius: 20px;
    min-width: 80px; height: 80px; padding: 0 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 5px 5px 0 var(--outline);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .target-letter.digraph { font-size: 38px; min-width: 104px; }

  .word-card {
    background: var(--card); border: 4px solid var(--outline);
    border-radius: var(--radius); box-shadow: 6px 6px 0 var(--outline);
    width: 100%; max-width: 340px; padding: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: slide-up 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .word-top { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* 解説の表示中は絵を小さくして「つぎへ」ボタンが画面内に収まるようにする */
  .word-card.explaining .word-top { flex-direction: row; justify-content: center; }
  .word-card.explaining .word-image-wrap { width: 72px; height: 72px; }
  .word-card.explaining .word-image-placeholder { font-size: 40px; }
  .word-image-wrap {
    width: 120px; height: 120px; border-radius: 14px; overflow: hidden;
    border: 3px solid #E0E0E0; background: #F5F5F5;
    display: flex; align-items: center; justify-content: center;
  }
  .word-image-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .word-image-placeholder { font-size: 62px; line-height: 1; }
  .word-text { font-size: 46px; color: var(--text); letter-spacing: 3px; text-align: center; }
  .speak-btn {
    background: #29B6F6; border: 3px solid var(--outline); border-radius: 50px;
    padding: 8px 22px; font-family: 'Fredoka One', cursive; font-size: 18px;
    color: var(--card); cursor: pointer; box-shadow: 3px 3px 0 var(--outline);
    display: flex; align-items: center; gap: 6px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .speak-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--outline); }

  .explain {
    width: 100%; text-align: center; color: var(--text);
    font-family: 'Nunito', sans-serif; font-weight: 900; line-height: 1.35;
    border-radius: 14px; padding: 8px 10px; background: #E8F5E9; border: 2px solid #66BB6A;
  }
  .explain[hidden] { display: none; }
  .explain.ng { background: #FFF3E0; border-color: #FFB74D; }
  .explain-judge { font-size: 15px; }
  .explain-word { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 34px; letter-spacing: 2px; }
  .explain-word b { font-weight: 400; color: var(--primary); text-decoration: underline; text-underline-offset: 5px; }
  .explain-text { font-size: 18px; }
  .explain-ans { font-size: 13px; color: #666; }
  .next-btn {
    width: 100%; max-width: 340px; height: 72px; border-radius: 18px; border: 4px solid var(--outline);
    font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--card); background: #29B6F6;
    cursor: pointer; box-shadow: 6px 6px 0 var(--outline);
  }
  .next-btn[hidden], .answer-row[hidden] { display: none; }
  .next-btn:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--outline); }
  .ans-btn small { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px; }

  .answer-row { display: flex; gap: 14px; width: 100%; max-width: 340px; }
  .ans-btn {
    flex: 1; height: 72px; border-radius: 18px; border: 4px solid var(--outline);
    font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--card);
    cursor: pointer; box-shadow: 6px 6px 0 var(--outline);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ans-btn:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--outline); }
  .ans-btn.yes { background: var(--yes); }
  .ans-btn.no  { background: var(--no); }
  .ans-btn:disabled { opacity: 0.5; pointer-events: none; }

  /* ========== RESULT SCREEN ========== */
  #result-screen { gap: 16px; text-align: center; justify-content: flex-start; padding-top: 28px; }
  .result-title {
    font-size: 50px; color: var(--card);
    text-shadow: 5px 5px 0 var(--outline); line-height: 1.1;
    animation: bounce 0.9s ease-in-out infinite;
  }
  .result-card {
    background: var(--card); border: 4px solid var(--outline);
    border-radius: var(--radius); box-shadow: 8px 8px 0 var(--outline);
    padding: 22px 36px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 230px;
  }
  .result-score-label { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px; color: #888; letter-spacing: 2px; }
  .result-score { font-size: 84px; line-height: 1; color: var(--primary); text-shadow: 4px 4px 0 var(--outline); }
  .result-sub { font-size: 17px; color: var(--text); }
  .result-stars { font-size: 34px; letter-spacing: 6px; }
  .result-message {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 19px;
    color: var(--card); text-shadow: 2px 2px 0 var(--outline);
    background: rgba(0,0,0,0.15); border-radius: 14px; padding: 10px 20px;
  }
  .replay-btn {
    padding: 18px 48px; font-family: 'Fredoka One', cursive; font-size: 34px;
    color: var(--card); background: var(--primary); border: 4px solid var(--outline);
    border-radius: var(--radius); cursor: pointer; box-shadow: 7px 7px 0 var(--outline);
    transition: transform 0.1s, box-shadow 0.1s; animation: pulse-btn 1.5s ease-in-out infinite;
  }
  .replay-btn:active { transform: translate(4px,4px); box-shadow: 3px 3px 0 var(--outline); animation: none; }
  .back-btn {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px;
    color: var(--card); background: transparent;
    border: 3px solid rgba(255,255,255,0.5); border-radius: 50px; padding: 10px 24px; cursor: pointer;
  }

  /* ========== WRONG ANSWERS REVIEW ========== */
  .wrong-list {
    width: 100%; max-width: 340px; margin-top: 6px;
  }
  .wrong-list-title {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
    color: var(--card); text-shadow: 1px 1px 0 var(--outline);
    text-align: center; margin-bottom: 8px;
  }
  .wrong-item {
    background: var(--card); border: 3px solid var(--outline);
    border-radius: 14px; padding: 10px 16px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 3px 3px 0 var(--outline);
    font-family: 'Nunito', sans-serif; font-weight: 700;
  }
  .wrong-item-emoji { font-size: 32px; }
  .wrong-item-word { font-size: 20px; color: var(--text); font-family: 'Fredoka One', cursive; }
  .wrong-item-info { font-size: 13px; color: #888; }

  /* ========== BEST SCORE BADGE ========== */
  .best-score-badge {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px;
    color: #FFD600; letter-spacing: 1px; margin-top: 2px;
  }

  /* ========== LETTER BUTTON PROGRESS DOT ========== */
  .letter-btn .progress-dot {
    position: absolute; bottom: 3px; right: 3px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--outline);
  }

  /* ========== COMBO OVERLAY ========== */
  .combo-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 150; pointer-events: none;
    font-family: 'Fredoka One', cursive; font-size: 48px;
    color: #fff; text-shadow: 4px 4px 0 var(--outline), 0 0 20px rgba(255,215,0,0.6);
    animation: combo-pop 1.5s ease-out forwards;
  }
  @keyframes combo-pop {
    0%   { transform: scale(0); opacity: 0; }
    15%  { transform: scale(1.1); opacity: 1; }
    25%  { transform: scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05) translateY(-30px); }
  }

  /* ========== NEAR-MISS / PERFECT ========== */
  .near-miss-msg {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 17px;
    padding: 10px 20px; border-radius: 14px; text-align: center; margin-top: 6px;
  }
  .near-miss-msg.near { background: #FFF3E0; color: #E65100; border: 2px solid #FFB74D; }
  .near-miss-msg.perfect {
    background: linear-gradient(135deg, #FFD700, #FFA000); color: #fff;
    font-size: 22px; text-shadow: 0 0 10px rgba(255,215,0,0.8);
    box-shadow: 0 0 20px rgba(255,215,0,0.4);
    animation: perfect-glow 1.5s ease-in-out infinite;
  }
  @keyframes perfect-glow {
    0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    50% { box-shadow: 0 0 35px rgba(255,215,0,0.7); }
  }

  /* ========== FEEDBACK ========== */
  .feedback-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.15s;
  }
  .feedback-overlay.show { opacity: 1; }
  .feedback-blob {
    font-size: 120px;
    animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 30px rgba(0,0,0,0.2));
  }

  /* ========== CONFETTI ========== */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti-piece {
    position: absolute; border-radius: 3px; top: -20px;
    animation: confetti-fall linear forwards;
  }

  /* ========== ANIMATIONS ========== */
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes pop-in {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes slide-up {
    0%   { transform: translateY(50px) scale(0.92); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes pulse-btn {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.04); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-3px) rotate(-3deg); }
    75%     { transform: translateX(3px) rotate(3deg); }
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }
</style>
<script>
/* ============================================================
 * MoWISE WiseGame Bridge v1.0 (2026-07-10)
 * 各ゲームに埋め込み、iframe親(MoWISE portal)へスコアを送信する。
 * 契約: src/lib/game-sdk.ts (source:'mowise-game',
 *       GAME_READY / GAME_SCORE / GAME_COMPLETE / GAME_EXIT)
 * スタンドアロン起動時(親なし)は何もしない=単体でも安全。
 * ============================================================ */
(function () {
  if (window.WiseGame) return;

  window.WiseGame = {
    gameId: null,
    _ctx: {},

    init: function (config) {
      config = config || {};
      if (config.gameId) this.gameId = config.gameId;
      this._send('GAME_READY', { gameId: this.gameId, version: config.version || '1.0' });
    },

    reportScore: function (data) {
      this._send('GAME_SCORE', this._merge(data));
    },

    reportComplete: function (data) {
      var payload = this._merge(data);
      payload.completed = true;
      this._send('GAME_COMPLETE', payload);
    },

    exit: function () {
      this._send('GAME_EXIT', { gameId: this.gameId });
    },

    _merge: function (data) {
      var out = { gameId: this.gameId };
      var k;
      for (k in this._ctx) out[k] = this._ctx[k];
      for (k in (data || {})) out[k] = data[k];
      return out;
    },

    _send: function (type, payload) {

const SOUND_LABEL = { ck: 'k' };
function snd(letter) { return '/' + (SOUND_LABEL[letter] || letter) + '/'; }

// 1つのボタンで2種類の音をあつかう文字の説明（スタート画面・プレイ画面に表示）
// 単語データを追加するときは、各単語に sound:'ながい /oo/' のように
// どちらの音かを書くと、回答後の解説にその表記が使われます。
const SOUND_NOTES = {
  oo: 'oo は 2しゅるい：book の みじかい /oo/ と、moon の ながい /oo/。どちらも YES だよ',
  th: 'th は 2しゅるい：this の こえを だす /th/ と、thin の いきだけの /th/。どちらも YES だよ',
};

// 判定基準：YES の単語がすべてその文字で始まるレッスンは「さいしょの おと」、
// そうでなければ「ことばの どこかに」。判定そのものは hasTarget で行うので、
// 表示する基準はデータから自動で決めて、表示と判定がずれないようにする。
// （lesson.rule = 'first' | 'any' を書けば手動指定もできる）
function lessonRule(letter) {
  const lesson = LESSONS[letter];
  if (lesson.rule) return lesson.rule;
  const yes = lesson.words.filter(w => w.hasTarget);
  return yes.every(w => w.word.startsWith(letter)) ? 'first' : 'any';
}

// 単語のさいしょの音（つづり→音。いまの単語データの範囲での簡易対応）
function firstGrapheme(word) {
  const two = word.slice(0, 2);
  return ['sh','ch','th','qu'].includes(two) ? two : word.slice(0, 1);
}
function firstSound(word) {
  const g = firstGrapheme(word);
  return '/' + ({ c: 'k', qu: 'kw' }[g] || g) + '/';
}

// 回答後の解説：「sun → さいしょが /s/」
function explainWord(it) {
  const L = it.letter, w = it.word, s = it.sound || snd(L);
  const idx = w.indexOf(L);
  if (it.hasTarget) {
    if (idx === 0) return { text: 'さいしょが ' + s, from: 0, len: L.length };
    if (idx > 0 && idx + L.length === w.length) return { text: 'さいごが ' + s, from: idx, len: L.length };
    if (idx > 0) return { text: 'まんなかに ' + s, from: idx, len: L.length };
    return { text: s + ' の おとが ある', from: 0, len: 0 };
  }
  if (lessonRule(L) === 'first') {
    let text = 'さいしょは ' + firstSound(w);
    if (idx > 0) text += '（' + s + ' は さいしょじゃ ないよ）';
    return { text: text, from: 0, len: firstGrapheme(w).length };
  }
  return { text: s + ' の おとは ない', from: 0, len: 0 };
}

// ============================================================
// SOUND EFFECTS (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playCorrectSound() {
  try {
    const ctx = getAudioCtx();
    const freqs = [523.25, 659.25, 783.99]; // C-E-G chime
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 0.3);
    });
  } catch(e) {}
}

function playWrongSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

  try {

      progress[letter] = { bestScore: 0, bestTotal: 0, gamesPlayed: 0, wrongHistory: {} };
    }
    const p = progress[letter];
    p.gamesPlayed++;
    if (total > 0 && (score / total) > (p.bestTotal > 0 ? p.bestScore / p.bestTotal : 0)) {
      p.bestScore = score;
      p.bestTotal = total;
    }
    // Track cumulative wrong answers
    wrongWords.forEach(w => {
      if (!p.wrongHistory[w]) p.wrongHistory[w] = 0;
      p.wrongHistory[w]++;
    });
    p.lastPlayed = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch(e) {}
}

function getLetterProgress(letter) {
  const progress = loadProgress();
  return progress[letter] || null;
}

// ============================================================
// URL パラメータ（ディープリンク）
//   ?letters=s,a      れんしゅうする もじ（カンマ区切り。letter= でも可）
//   &mode=practice    practice（じかん なし） | time（30びょう タイムアタック）
//   &count=10         れんしゅうモードの問題数（3〜20）
//   &warmup=0         おためし2問を出さない
// 音声の自動再生制限があるため、指定内容をえらんだ状態でスタート画面を開き、
// 「あそぶ！」を1回おすと始まる。
// ============================================================
function hasData(letter) {
  return !!(LESSONS[letter] && LESSONS[letter].words.length > 0);
}
function groupColor(letter) {
  const g = JP_GROUPS.find(g => g.sounds.includes(letter));
  return g ? g.color : '#FF6F00';
}
const deepLink = { active: false, letters: [], skipped: [] };
function applyUrlParams() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { return; }
  const raw = p.get('letters') || p.get('letter') || p.get('sounds') || '';
  raw.toLowerCase().split(/[,\s]+/).filter(Boolean).forEach(l => {
    if (hasData(l)) {
      if (!deepLink.letters.includes(l)) deepLink.letters.push(l);
    } else if (LESSONS[l] && !deepLink.skipped.includes(l)) deepLink.skipped.push(l);   // じゅんびちゅうの もじ
  });
  const mode = (p.get('mode') || '').toLowerCase();
  if (mode === 'practice') state.mode = 'practice';
  else if (['time', 'timed', 'timeattack', 'time-attack'].includes(mode)) state.mode = 'time';
  const count = parseInt(p.get('count'), 10);
  if (!isNaN(count)) {
    state.count = Math.min(20, Math.max(3, count));
    if (!mode) state.mode = 'practice';
  }
  const warm = (p.get('warmup') || '').toLowerCase();
  if (['0', 'false', 'off', 'no'].includes(warm)) state.warmup = false;
  state.selected = deepLink.letters.map(l => ({ letter: l, color: groupColor(l) }));
  deepLink.active = deepLink.letters.length > 0 || deepLink.skipped.length > 0 || !!mode || !isNaN(count);
}

function renderModeChips() {

function modeText() {

}

function renderBanner() {
  const el = document.getElementById('deeplink-banner');
  if (!deepLink.active) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '';
  const add = (tag, text) => { const d = document.createElement(tag); d.textContent = text; el.appendChild(d); return d; };

function updateStartButton() {
  state.selectedLetter = state.selected.length ? state.selected.map(x => x.letter).join(',') : null;
  document.getElementById('start-btn').disabled = state.selected.length === 0;
}

function darken(hex) {
  // 簡易暗色化
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - 40);
  const g = Math.max(0, ((n >> 8) & 0xff) - 40);
  const b = Math.max(0, (n & 0xff) - 40);
  return `rgb(${r},${g},${b})`;
}

// もじは いくつでも えらべる（もういちど おすと はずれる）
function selectLetter(letter, el, color) {
  const i = state.selected.findIndex(x => x.letter === letter);
  if (i >= 0) { state.selected.splice(i, 1); el.classList.remove('selected'); }
  else { state.selected.push({ letter: letter, color: color }); el.classList.add('selected'); }
  updateStartButton();
  renderBanner();
}

// ============================================================
// GAME START
// ============================================================
document.getElementById('start-btn').addEventListener('click', () => startGame());

function toItem(sel, w) {
  return { letter: sel.letter, color: sel.color, word: w.word, hasTarget: w.hasTarget, sound: w.sound };
}

// YES / NO がほぼ半分ずつになるように n 問えらぶ（avoid の単語はなるべく後回し）
function pickBalanced(words, n, avoid) {
  const order = arr => {
    const a = shuffle(arr.slice());
    return a.filter(w => !avoid.includes(w.word)).concat(a.filter(w => avoid.includes(w.word)));
  };
  const pools = [order(words.filter(w => w.hasTarget)), order(words.filter(w => !w.hasTarget))];
  const used = [0, 0];
  const out = [];
  let side = Math.random() < 0.5 ? 0 : 1;
  while (out.length < n) {
    if (pools[side].length) out.push(pools[side][used[side]++ % pools[side].length]);
    side = 1 - side;
  }
  return shuffle(out);
}

function refillTimeQueue() {
  state.selected.forEach(sel => {
    shuffle(LESSONS[sel.letter].words.slice()).forEach(w => state.queue.push(toItem(sel, w)));
  });
}

function startGame(opts) {
  opts = opts || {};
  if (!state.selected.length) return;
  window.__wiseStartTime = Date.now();
  state.session++;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  state.score = 0; state.total = 0;
  state.timeLeft = GAME_DURATION;
  state.paused = false;
  state.wrongAnswers = [];
  state.wrongItems = [];
  state.perLetter = {};
  state.selected.forEach(sel => { state.perLetter[sel.letter] = { score: 0, total: 0, wrong: [] }; });
  state.combo = 0;
  state.maxCombo = 0;
  state.recentAnswers = [];
  state.adaptiveSpeed = 1.0;

  // おためし（採点しない）2問：さいしょの もじで YES を1問、NO を1問
  state.warmQueue = []; state.warmIndex = 0;
  const first = state.selected[0];
  if (state.warmup && !opts.skipWarmup) {
    const words = LESSONS[first.letter].words;
    const yes = shuffle(words.filter(w => w.hasTarget))[0];
    const no = shuffle(words.filter(w => !w.hasTarget))[0];
    [yes, no].forEach(w => { if (w && state.warmQueue.length < WARMUP_COUNT) state.warmQueue.push(toItem(first, w)); });
  }
  const warmWords = state.warmQueue.map(it => it.word);

  // 本番の問題
  state.queue = []; state.qIndex = 0;
  if (state.mode === 'practice') {
    const n = state.selected.length;
    const total = Math.max(state.count, n);          // どの もじも 1問は出す
    state.selected.forEach((sel, i) => {
      const share = Math.floor(total / n) + (i < total % n ? 1 : 0);
      pickBalanced(LESSONS[sel.letter].words, share, i === 0 ? warmWords : [])
        .forEach(w => state.queue.push(toItem(sel, w)));
    });
  } else {
    refillTimeQueue();
  }

  document.getElementById('score-num').textContent = '0';
  document.getElementById('q-num').textContent = '0';
  state.phase = state.warmQueue.length ? 'warmup' : 'main';
  showScreen('game-screen');
  if (state.phase === 'main') beginMain(true);
  else { updateHud(); nextWord(); }
}

// おためしが終わったら（または無い場合は最初から）本番へ
function beginMain(silent) {
  state.phase = 'main';
  if (!silent) showComboOverlay('ここから ほんばん！');
  updateHud();
  nextWord();
  if (state.mode === 'time') startTimer();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============================================================
// HUD・ターゲット・判定基準の表示
// ============================================================
function updateHud() {
  const num = document.getElementById('timer-num');
  const phase = document.getElementById('phase-label');
  if (state.phase === 'warmup') {
    phase.textContent = '🔰 おためし（てんすうに はいらないよ）';
    phase.className = 'phase-label warmup';
    num.textContent = 'おためし ' + Math.max(1, state.warmIndex) + '/' + state.warmQueue.length;
    num.className = 'timer-num small';
    setBar(state.warmIndex / state.warmQueue.length);
  } else if (state.mode === 'practice') {
    phase.textContent = '🌱 れんしゅう（じかんは きにしないで OK）';
    phase.className = 'phase-label';
    num.textContent = Math.max(1, state.qIndex) + ' / ' + state.queue.length;
    num.className = 'timer-num small';
    setBar(state.total / state.queue.length);
  } else {
    phase.textContent = '⏱ タイムアタック 30びょう';
    phase.className = 'phase-label';
    updateTimerDisplay();
  }
}
function setBar(ratio) {
  document.getElementById('timer-bar').style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%';
}

function showTarget(item) {
  const tl = document.getElementById('target-letter');
  const changed = tl.dataset.letter !== item.letter;
  tl.textContent = item.letter;
  tl.dataset.letter = item.letter;
  tl.className = 'target-letter' + (item.letter.length > 1 ? ' digraph' : '');
  tl.style.background = item.color;
  if (changed) { tl.style.animation = 'none'; tl.offsetHeight; tl.style.animation = ''; }

  // 判定基準：実際の判定（データ）と同じ基準を表示する
  const rule = document.getElementById('rule-text');
  rule.innerHTML = '';
  const s = document.createElement('span');
  s.className = 'snd';
  s.textContent = snd(item.letter);
  if (lessonRule(item.letter) === 'first') {
    rule.append('さいしょの おとが ', s, ' かな？');
  } else {
    rule.append('ことばの どこかに ', s, ' の おとが あるかな？');
  }
  const note = document.getElementById('sound-note');
  note.hidden = !SOUND_NOTES[item.letter];
  note.textContent = SOUND_NOTES[item.letter] || '';
  return changed;
}

// ============================================================
// WORD
// ============================================================
function nextWord() {
  let item;
  if (state.phase === 'warmup') {
    item = state.warmQueue[state.warmIndex++];
  } else {
    if (state.qIndex >= state.queue.length) {
      if (state.mode === 'practice') { endGame(); return; }
      refillTimeQueue();
    }
    item = state.queue[state.qIndex++];
  }
  const prev = state.currentWord;
  state.currentWord = item;
  state.answering = true;
  state.paused = false;
  document.getElementById('explain').hidden = true;
  document.getElementById('word-card').classList.remove('explaining');
  document.getElementById('next-btn').hidden = true;
  document.getElementById('answer-row').hidden = false;
  setButtons(true);
  const changed = showTarget(item);
  if (changed && prev && state.phase === 'main') showComboOverlay('つぎは ' + item.letter + ' ！');
  if (state.phase === 'warmup' || state.mode === 'practice') updateHud();
  displayWord(item.word);
  speakWord();
}

function displayWord(word) {
  // document.getElementById('word-text').textContent = word; // 単語テキスト表示を無効化
  const wrap = document.getElementById('word-image-wrap');
  const imgPath = IMAGE_DIR + word + IMAGE_EXT;
  const img = new Image();
  img.onload = () => {
    wrap.innerHTML = '';
    const el = document.createElement('img');
    el.src = imgPath; el.alt = word;
    wrap.appendChild(el);
  };
  img.onerror = () => {
    wrap.innerHTML = '';
    const pl = document.createElement('div');
    pl.className = 'word-image-placeholder';
    pl.textContent = WORD_EMOJI[word] || '🔤';
    wrap.appendChild(pl);
  };
  img.src = imgPath;
  const card = document.getElementById('word-card');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';
}

// ============================================================
// AUDIO
// ============================================================
let currentAudio = null;
function speakWord() {
  if (!state.currentWord) return;
  const word = state.currentWord.word;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=en-us&client=tw-ob`;
  const audio = new Audio(url);
  audio.play().catch(() => {
    try {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US'; u.rate = 0.85;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  });
  currentAudio = audio;
}
function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}

// ============================================================
// ANSWER
// ============================================================
function answer(userSaysYes) {
  if (!state.answering) return;
  state.answering = false;
  setButtons(false);
  const cw = state.currentWord;
  const correct = (userSaysYes === cw.hasTarget);
  const scored = state.phase === 'main';   // おためしは採点も記録もしない

  if (scored) {
    state.total++;
    state.perLetter[cw.letter].total++;
    document.getElementById('q-num').textContent = state.total;
    // Track for adaptive difficulty
    state.recentAnswers.push(correct);
    if (state.recentAnswers.length > 5) state.recentAnswers.shift();
    updateAdaptiveSpeed();
  }

  if (correct) {
    showFeedback('✅');
    playCorrectSound();
    if (scored) {
      state.score++;
      state.perLetter[cw.letter].score++;
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      document.getElementById('score-num').textContent = state.score;
      // Combo milestones
      const milestones = { 3: 'NICE! 🔥', 5: 'GREAT! ⚡', 7: 'AMAZING! 🌟', 10: 'UNSTOPPABLE! 💥' };
      if (milestones[state.combo]) showComboOverlay(milestones[state.combo]);
    }
  } else {
    showFeedback('❌');
    playWrongSound();
    if (scored) {
      state.combo = 0;
      state.perLetter[cw.letter].wrong.push(cw.word);
      state.wrongItems.push(cw);
      state.wrongAnswers.push({
        q: cw.word + ' → ' + (lessonRule(cw.letter) === 'first'
          ? 'さいしょの音が ' + cw.letter + ' ？'
          : cw.letter + ' の音がある？'),
        correct: cw.hasTarget ? 'Yes' : 'No',
        chosen: userSaysYes ? 'Yes' : 'No',
        tag: 'digraph',
        word: cw.word
      });
      // WiseXP: report wrong answer
      if(window.WiseXP) window.WiseXP.reportWrong({question:cw.word+' (target: '+cw.letter+')', correct:String(cw.hasTarget), playerAnswer:String(userSaysYes)});
    }
  }

  showExplain(cw, correct);
  if (state.phase === 'main' && state.mode === 'practice') setBar(state.total / state.queue.length);

  const session = state.session;
  setTimeout(() => { if (session === state.session) hideFeedback(); }, 600);

  if (state.phase === 'main' && state.mode === 'time') {
    // タイムアタック：解説を読むあいだは時計を止めて、自動でつぎへ
    state.paused = true;
    setTimeout(() => { if (session === state.session) advance(); }, correct ? 900 : 2400);
  } else {
    // おためし・れんしゅう：じぶんの ペースで「つぎへ」
    document.getElementById('answer-row').hidden = true;
    const next = document.getElementById('next-btn');
    const lastWarm = state.phase === 'warmup' && state.warmIndex >= state.warmQueue.length;
    const lastMain = state.phase === 'main' && state.qIndex >= state.queue.length;
    next.textContent = lastWarm ? 'ほんばん スタート ▶' : lastMain ? 'けっかを みる ▶' : 'つぎへ ▶';
    next.hidden = false;
    if (next.scrollIntoView) next.scrollIntoView({ block: 'nearest' });
  }
}

// 回答後：絵・単語・音をむすびつけて見せる（例：sun → さいしょが /s/）
function showExplain(item, correct) {
  const ex = explainWord(item);
  const box = document.getElementById('explain');
  box.className = 'explain' + (correct ? '' : ' ng');
  document.getElementById('explain-judge').textContent = correct ? '⭕ せいかい！' : '❌ ざんねん…';
  const w = document.getElementById('explain-word');
  w.innerHTML = '';
  if (ex.len > 0) {
    const b = document.createElement('b');
    b.textContent = item.word.slice(ex.from, ex.from + ex.len);
    w.append(item.word.slice(0, ex.from), b, item.word.slice(ex.from + ex.len));
  } else {
    w.textContent = item.word;
  }
  document.getElementById('explain-text').textContent = '→ ' + ex.text;
  document.getElementById('explain-ans').textContent = 'だから こたえは ' + (item.hasTarget ? 'YES' : 'NO');
  box.hidden = false;
  document.getElementById('word-card').classList.add('explaining');
}

function advance() {
  if (state.answering) return;
  hideFeedback();
  if (state.phase === 'warmup') {
    if (state.warmIndex >= state.warmQueue.length) beginMain(false);
    else nextWord();
  } else {
    nextWord();   // れんしゅうモードで問題が終わっていれば nextWord が endGame を呼ぶ
  }
}

function showComboOverlay(text) {
  const existing = document.querySelector('.combo-overlay');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'combo-overlay';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function updateAdaptiveSpeed() {
  if (state.recentAnswers.length < 5) { state.adaptiveSpeed = 1.0; return; }
  const correctCount = state.recentAnswers.filter(Boolean).length;
  const accuracy = correctCount / state.recentAnswers.length;
  if (accuracy < 0.4) state.adaptiveSpeed = 0.7; // slow down
  else if (accuracy > 0.8) state.adaptiveSpeed = 1.3; // speed up
  else state.adaptiveSpeed = 1.0;
}

function setButtons(en) {
  document.getElementById('btn-yes').disabled = !en;
  document.getElementById('btn-no').disabled = !en;
}

function showFeedback(emoji) {
  const ov = document.getElementById('feedback-overlay');
  const bl = document.getElementById('feedback-blob');
  bl.textContent = emoji;
  bl.style.animation = 'none'; bl.offsetHeight; bl.style.animation = '';
  ov.classList.add('show');
}
function hideFeedback() {
  document.getElementById('feedback-overlay').classList.remove('show');
}

// ============================================================
// TIMER（タイムアタックのみ）
// ============================================================
function startTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timeLeft = GAME_DURATION;
  updateTimerDisplay();
  state.timer = setInterval(() => {
    if (state.paused) return;   // 解説の表示中は止める
    state.timeLeft -= 0.1 * state.adaptiveSpeed;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      updateTimerDisplay();
      clearInterval(state.timer);
      state.timer = null;
      endGame();
    } else { updateTimerDisplay(); }
  }, 100);
}
function updateTimerDisplay() {
  const n = Math.ceil(state.timeLeft);
  const el = document.getElementById('timer-num');
  el.textContent = n;
  el.className = 'timer-num' + (n <= 5 ? ' warning' : '');
  updateTimerBar();
}
function updateTimerBar() {
  setBar(state.timeLeft / GAME_DURATION);
}

// ============================================================
// END GAME
// ============================================================
function endGame() {
  state.session++;            // 残っている遅延処理（つぎの単語の読み上げ等）を無効にする
  state.answering = false;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  stopAudio();
  hideFeedback();
  document.querySelectorAll('.combo-overlay').forEach(el => el.remove());
  setButtons(false);
  const ratio = state.total > 0 ? state.score / state.total : 0;
  let stars='⭐', title='おわり！', msg='もう いっかい やってみよう！';
  if (ratio >= 0.9)      { stars='⭐⭐⭐'; title='🎉 すごい！！'; msg='ほとんど パーフェクト！！'; launchConfetti(); }
  else if (ratio >= 0.7) { stars='⭐⭐';   title='😄 よくできました！'; msg='どんどん じょうずに なってるよ！'; }
  // Save progress to localStorage（もじごとに記録）
  Object.keys(state.perLetter).forEach(letter => {
    const pl = state.perLetter[letter];
    if (pl.total > 0) saveProgress(letter, pl.score, pl.total, pl.wrong);
  });

  // WiseXP: report game result
  if(window.WiseXP) window.WiseXP.reportGame({score:state.score, correct:state.score, total:state.total, maxCombo:state.maxCombo, grade:''});

  // → MoWISE portal へスコア送信 (WiseGame Bridge)
  try {
    const pct = state.total > 0 ? Math.round((state.score / state.total) * 100) : 0;
    window.WiseGame && window.WiseGame.reportComplete({
      score: pct, maxScore: 100, accuracy: pct,
      timeSpent: Math.round((Date.now() - (window.__wiseStartTime || Date.now())) / 1000),
      metadata: { letter: state.selectedLetter, mode: state.mode, correct: state.score,
                  total: state.total, wrongAnswers: (state.wrongAnswers || []).slice(-20).map(w => typeof w === 'string' ? {q:w,correct:'',chosen:'',tag:'digraph'} : w) }
    });
  } catch(e) {}

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').textContent = state.score;
  document.getElementById('result-sub').textContent = `${state.total}もん ちゅう ${state.score}もん せいかい`;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-message').textContent = msg;

  // Near-miss / Perfect feedback
  const nearMissEl = document.getElementById('near-miss-feedback');
  if (nearMissEl) nearMissEl.remove();
  const pctScore = state.total > 0 ? Math.round((state.score / state.total) * 100) : 0;
  if (pctScore === 100 && state.total > 0) {
    const el = document.createElement('div');
    el.id = 'near-miss-feedback';
    el.className = 'near-miss-msg perfect';
    el.textContent = 'PERFECT! 💎';
    document.getElementById('result-message').after(el);
  } else if (pctScore >= 80 && pctScore < 100) {
    const remaining = state.total - state.score;
    const el = document.createElement('div');
    el.id = 'near-miss-feedback';
    el.className = 'near-miss-msg near';
    el.textContent = `あと ${remaining}もんで パーフェクト！ もう いっかい？`;
    document.getElementById('result-message').after(el);
  }

  // Show best score（もじごと）
  const bestBadge = document.getElementById('best-score-badge');
  bestBadge.textContent = Object.keys(state.perLetter).map(letter => {
    const prog = getLetterProgress(letter);
    return prog && prog.bestTotal > 0
      ? `BEST ${letter}: ${prog.bestScore}/${prog.bestTotal} (${prog.gamesPlayed}かいプレイ)` : '';
  }).filter(Boolean).join(' ／ ');

  // Show wrong answers review
  const wrongList = document.getElementById('wrong-list');
  wrongList.innerHTML = '';
  if (state.wrongItems.length > 0) {
    // Deduplicate（もじ＋単語）
    const seen = {};
    const unique = state.wrongItems.filter(it => {
      const k = it.letter + '|' + it.word;
      if (seen[k]) return false;
      seen[k] = true; return true;
    });
    const titleEl = document.createElement('div');
    titleEl.className = 'wrong-list-title';
    titleEl.textContent = `まちがえた ことば (${unique.length})`;
    wrongList.appendChild(titleEl);

    unique.forEach(it => {
      const item = document.createElement('div');
      item.className = 'wrong-item';
      const emoji = document.createElement('span');
      emoji.className = 'wrong-item-emoji';
      emoji.textContent = WORD_EMOJI[it.word] || '🔤';
      const wordEl = document.createElement('span');
      wordEl.className = 'wrong-item-word';
      wordEl.textContent = it.word;
      const info = document.createElement('span');
      info.className = 'wrong-item-info';
      info.textContent = '→ ' + explainWord(it).text + '（' + (it.hasTarget ? 'YES' : 'NO') + '）';
      item.appendChild(emoji);
      item.appendChild(wordEl);
      item.appendChild(info);
      wrongList.appendChild(item);
    });
  }

  showScreen('result-screen');
}

// ============================================================
// CONFETTI
// ============================================================
function launchConfetti() {
  const c = document.getElementById('confetti-container');
  c.innerHTML = '';
  const cols = ['#E53935','#FFD600','#00C853','#1E88E5','#FF1744','#8E24AA'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = cols[Math.floor(Math.random()*cols.length)];
    p.style.width = (8+Math.random()*12)+'px';
    p.style.height = (8+Math.random()*12)+'px';
    p.style.animationDuration = (1.5+Math.random()*2)+'s';
    p.style.animationDelay = (Math.random()*0.8)+'s';
    c.appendChild(p);
  }
  setTimeout(() => c.innerHTML='', 4000);
}

// ============================================================
// NAV
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  el.scrollTop = 0;
}
function replay() { startGame({ skipWarmup: true }); }   // 2回目からは おためし なし
function goHome() {
  state.session++;            // 残っている遅延処理を無効にする
  state.answering = false;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  stopAudio();
  hideFeedback();
  showScreen('start-screen');
  init();
}

applyUrlParams();
init();

// WiseXP SDK init
// SDK はこのスクリプトより後に読み込まれるので、読み込み完了時（onload）に呼ぶ。
function initWiseXP() {
  if (window.WiseXP && !window.__wiseXpInited) {
    window.__wiseXpInited = true;
    try { window.WiseXP.init('phonics-sounds'); } catch (e) {}
  }
}
initWiseXP();
</script>
<script src="https://cdn.jsdelivr.net/gh/winniek75/wise-xp-sdk@main/wise-xp.js" onload="initWiseXP()"></script>
